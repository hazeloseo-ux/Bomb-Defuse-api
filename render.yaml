# Render Blueprint: one free web service and one free PostgreSQL database.
# In the Render dashboard: New > Blueprint > this repository. Render reads this file.
# The two "name" values become part of the public address.
services:
  - type: web
    name: bomb-defuse-hazeloseo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bomb-defuse-hazeloseo-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Asked for once, when you create the Blueprint. Never written in this file.
      - key: HUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SCHOOL_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: bomb-defuse-hazeloseo-db
    plan: free
    region: singapore
    databaseName: bomb_defuse
    ipAllowList: []          # only services inside Render may connect